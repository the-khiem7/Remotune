version: '3'

tasks:
  bindings:
    desc: Generate Wails TypeScript bindings
    cmds:
      - wails3 generate bindings -ts

  frontend:build:
    desc: Install locked frontend dependencies and build production assets
    deps: [bindings]
    dir: frontend
    cmds:
      - bun install --frozen-lockfile
      - bun run build

  resources:
    desc: Generate the reproducible Windows icon resource
    deps: [frontend:build]
    cmds:
      - wails3 generate syso -arch amd64 -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -out wails_windows_amd64.syso

  verify:
    desc: Run formatting, vet, and the native short test suite
    deps: [resources]
    cmds:
      - cmd: >-
          powershell.exe -NoProfile -Command '$unformatted = @(gofmt -l . | Where-Object { $_ -notmatch "^(engine[\\/])" }); if ($unformatted.Count -gt 0) { Write-Error ("Files need gofmt:" + [Environment]::NewLine + ($unformatted -join [Environment]::NewLine)); exit 1 }'
      - go vet ./...
      - go test ./... -count=1 -short

  windows:portable:
    desc: Build the versioned portable Windows executable
    deps: [resources]
    cmds:
      - cmd: >-
          powershell.exe -NoProfile -Command '$ErrorActionPreference = "Stop"; $version = (Get-Content version.txt -Raw).Trim(); if ($version -notmatch "^\d+\.\d+\.\d+$") { throw ("Invalid version in version.txt: " + $version) }; $configVersion = ((Select-String -Path build/config.yml -Pattern "^\s+version:" | Select-Object -First 1).Line -replace "[^0-9.]", ""); if ($configVersion -ne $version) { throw ("Version mismatch: version.txt=" + $version + ", build/config.yml=" + $configVersion) }; New-Item -ItemType Directory -Path out -Force | Out-Null; $artifactPath = Join-Path (Get-Location) ("out\\remotune-v" + $version + ".exe"); if (Test-Path $artifactPath) { try { $stream = [IO.File]::Open($artifactPath, [IO.FileMode]::Open, [IO.FileAccess]::ReadWrite, [IO.FileShare]::None); $stream.Close() } catch { throw ("Cannot overwrite remotune-v" + $version + ".exe because it is locked. Close the application and retry.") } }; go build -trimpath -ldflags ("-s -w -H windowsgui -X main.version=" + $version) -o $artifactPath .; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; if (-not (Test-Path $artifactPath)) { throw ("Build failed: " + $artifactPath + " was not created") }; $size = (Get-Item $artifactPath).Length; Write-Output ("Build succeeded: out/remotune-v" + $version + ".exe (" + $size + " bytes, v" + $version + ")")'
